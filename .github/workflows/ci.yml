name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=asharelens
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Verify dependency consistency
        run: python -m pip check

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: asharelens_test
          MYSQL_USER: asharelens
          MYSQL_PASSWORD: asharelens-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot-test-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ASHARELENS_DATABASE_URL: mysql+pymysql://asharelens:asharelens-test-password@127.0.0.1:3306/asharelens_test?charset=utf8mb4
      ASHARELENS_TEST_DATABASE_URL: mysql+pymysql://asharelens:asharelens-test-password@127.0.0.1:3306/asharelens_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: MySQL integration
        run: python -m pytest -m mysql -v

  container:
    runs-on: ubuntu-latest
    env:
      ASHARELENS_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag asharelens:ci .
      - name: Start product stack
        run: docker compose up --detach --no-build
      - name: Wait for Web health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs
          exit 1
      - name: Verify migrated database and Runner
        run: |
          docker compose exec -T web asharelens database check
          docker compose exec -T runner asharelens runner doctor
      - name: Stop product stack
        if: always()
        run: docker compose down --volumes
