name: 功能建议
description: 提议一个有明确边界、可验证的改进
title: "[Feature] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 先描述需要解决的问题，不只描述实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: correctness
    attributes:
      label: 时点、数据、成交与失败语义
      description: 如何避免未来函数、静默缺数、重复执行或不可复现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与非目标
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不要求 AShareLens 执行实盘交易。
          required: true
