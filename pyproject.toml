[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "asharelens"
version = "0.1.0"
description = "开箱即用、可解释、可复现的本地 A 股量化选股平台"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "AShareLens contributors" }]
keywords = ["a-share", "quant", "stock-screening", "backtest", "china-stock"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
baostock = [
  "baostock>=0.9.3,<1",
]
server = [
  "alembic>=1.14,<2",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0.36,<3",
]
dev = [
  "alembic>=1.14,<2",
  "build>=1.2,<2",
  "editables>=0.5,<1",
  "mypy>=1.11,<2",
  "pymysql>=1.1,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "sqlalchemy>=2.0.36,<3",
]

[project.scripts]
asharelens = "asharelens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/asharelens"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "；", "（", "）"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["asharelens"]

[tool.coverage.report]
show_missing = true
skip_covered = true
